<div class="login">
  <form class="custom-form" (ngSubmit)="onSubmit()">
    <h1>Login - Vintage Party</h1>
    <input
    type="text"
    [(ngModel)]="username"
      name="email"
      placeholder="Email"
      required="required"
    />
    <input
    type="password"
    [(ngModel)]="password"
      slot=""
      name="password"
      placeholder="Password"
      required="required"
    />
   
    <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
      <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
      {{ isSubmitting ? 'Ingresando...' : 'Log in' }}
    </button>
  </form>
</div>

<ng-template #errorModal let-modal>
	<div class="modal-header">
		<h4 class="modal-title">Error de Autenticación</h4>
		<button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
	</div>
	<div class="modal-body">
		<p>{{ errorMessage }}</p>
	</div>
	<div class="modal-footer">
		<button type="button" class="btn btn-secondary" (click)="modal.close('Close click')">Cerrar</button>
	</div>
</ng-template>
