<div id="formulario" [ngClass]="{ 'quick-add-modal': activeModal }" *ngIf="condicion ; else otraPlantilla">
  <div class="modal-header border-0 pb-0" *ngIf="activeModal">
    <h5 class="modal-title">Agregar Cliente</h5>
    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      (click)="closeQuickAdd()">
    </button>
  </div>
  <div class="row" id="salto" *ngIf="!activeModal">
    <a>Agregar Clientes</a>
  </div>
  <div class="row" id="salto" >
    <div class="col-lg-4">
      <div class="input-group">
        <label class="input-group-text" for="nombreApellido" id="nombreA">Nom. y Ap.</label>
        <input type="text" class="form-control" [(ngModel)]="name" id="nombreApellido" name="name" placeholder="Nombre y Apellido">
      </div>
    </div>
    <div class="col-lg-4">
      <div class="input-group">
        <label class="input-group-text" for="documentNumber" id="nombreA">DNI/RUC/CE</label>
        <input type="text" class="form-control" [(ngModel)]="documentNumber" maxlength="11" name="documentNumber" placeholder="DNI/RUC/CE">
      </div>
    </div>
    <div class="col-lg-4">
      <div class="input-group">
        <label class="input-group-text" for="phone" id="nombreA">Celular</label>
        <input type="tel" class="form-control" [(ngModel)]="phone" name="phone" maxlength="9" placeholder="Celular">
      </div>
    </div>
  </div>
  <div class="row" id="salto">
    <div class="col-lg-12">
      <div class="input-group">
        <label class="input-group-text" for="address" id="nombreA">Direccion</label>
        <input type="text" class="form-control" [(ngModel)]="address" name="address" placeholder="Direccion">
      </div>
    </div>
  </div>
  <div class="row" id="salto">
    <div class="col-lg-3">
      <button type="submit" (click)="onSubmit()" class="btn btn-primary" [disabled]="isSubmitting" *ngIf="mostrarBotones">
        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
        {{ isSubmitting ? 'Guardando...' : 'Agregar' }}
      </button>
      <button type="submit" (click)="updateCustomer()" class="btn btn-primary" [disabled]="isSubmitting" *ngIf="!mostrarBotones">
        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
        {{ isSubmitting ? 'Guardando...' : 'Actualizar' }}
      </button>
      <button type="submit" (click)="onSubmitExit()" class="btn btn-danger">{{ activeModal ? 'Cancelar' : 'Volver' }}</button>
  </div>
  </div>
</div>

<ng-template #otraPlantilla>
  <div id="formularioListado"> 
    <div class="row" id="salto" >
      <form >
        <div class="row" id="salto">
          <button type="submit"  (click)="onSubmitAdd()" class="btn btn-primary">Agregar Cliente</button>
        </div>
      </form>
    </div>
    <div class="row" id="salto">
      <div class="col-lg-8">
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            placeholder="Buscar por nombre, documento o dirección"
            [(ngModel)]="searchValue"
            (keyup.enter)="onGlobalSearch()"
            name="customerSearch"
          />
          <button type="button" class="btn btn-primary" (click)="onGlobalSearch()">Buscar</button>
          <button type="button" class="btn btn-outline-secondary" (click)="clearGlobalSearch()">Limpiar</button>
        </div>
      </div>
    </div>
    <div class="row" id="salto" >
      <table>
        <thead>
          <tr>
            <th>Eliminar</th>
            <th>Seleccionar</th>
            <th>Nombre</th>
            <th>DNI</th>
            <th>Direccion</th>
            <th>Telefono</th>
            <th>Seguimiento</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of customer">
            <td><button type="button" class="btn btn-danger" (click)="open(mymodal,item._id)">Eliminar</button></td>
            <td><button type="button" class="btn btn-primary" (click)="findCustomerById(item.documentNumber)">seleccionar</button></td>
            <td>{{ item.name }}</td>
            <td>{{ item.documentNumber }}</td>
            <td>{{ item.address }}</td>
            <td>{{ item.phone }}</td>
            <td><button type="button" class="btn btn-outline-secondary btn-sm" (click)="verSeguimiento(item)">Dar seguimiento</button></td>
          </tr>
        </tbody>
      </table>
    </div>
    
  </div>
</ng-template>
<ng-template #mymodal let-modal>
  <div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">Eliminar Cliente</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
  </div>
  <div class="modal-body">
    Desea Eliminar un Cliente?
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-success" (click)="deleteAccesosry();modal.close('Save click')">SI</button>
    <button type="button" class="btn btn-outline-dark" (click)="modal.close('Save click')">NO</button>
  </div>
</ng-template>
